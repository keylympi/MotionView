name: Build MotionView (Windows)

# Manual run only: Actions tab -> "Build MotionView (Windows)" -> Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: MotionView
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: MotionView/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: MotionView/src-tauri -> target

      # --frozen-lockfile keeps the npm Tauri packages on the same version as
      # the Rust crate in Cargo.lock, which avoids the version-mismatch error.
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bridge and PROS terminal executables
        run: |
          pnpm py:clean
          pnpm py:build

      - name: Build installer
        run: pnpm tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MotionView-windows-installer
          path: MotionView/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
